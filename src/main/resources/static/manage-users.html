<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

      content="width=device-width, initial-scale=1.0">

<nav class="navbar">

    <div class="nav-links">

        <a href="manage-complaints.html">

    <div class="page-header">

        <p>
            View and manage registered users.

            </thead>

            <tbody id="usersTable">

            </tbody>

        </table>
